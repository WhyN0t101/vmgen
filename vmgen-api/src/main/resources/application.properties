spring.application.name=vmgen-api

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/vmgen
spring.datasource.username=vmgen
spring.datasource.password=vmgen
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (HS256)
# NOTE: set vmgen.jwt.secret via environment variable in production
vmgen.jwt.secret=CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME
vmgen.jwt.issuer=vmgen-api
vmgen.jwt.user-ttl-seconds=3600
vmgen.jwt.admin-ttl-seconds=1800

