spring.application.name=vmgen-api

# Local dev convenience:
# Load variables from a local ".env" file in the working directory (NOT committed).
# Format must be properties-style: KEY=value (e.g., PROXMOX_TOKEN_SECRET=...).
spring.config.import=optional:file:.env[.properties]

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/vmgen
spring.datasource.username=vmgen
spring.datasource.password=vmgen
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (HS256)
# REQUIRED: Set VMGEN_JWT_SECRET environment variable in production
# Minimum 32 bytes (256 bits) for HS256
vmgen.jwt.secret=${VMGEN_JWT_SECRET:CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME}
vmgen.jwt.issuer=vmgen-api
vmgen.jwt.user-ttl-seconds=3600
vmgen.jwt.admin-ttl-seconds=1800

# CORS Configuration
# Comma-separated list of allowed origins (e.g., http://localhost:5173,https://vmgen.example.com)
vmgen.cors.allowed-origins=${VMGEN_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
vmgen.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
vmgen.cors.allowed-headers=Authorization,Content-Type
vmgen.cors.allow-credentials=true
vmgen.cors.max-age=3600

# Rate Limiting
# Login attempts per IP per time window
vmgen.rate-limit.login.max-requests=${VMGEN_RATE_LIMIT_LOGIN_MAX:5}
vmgen.rate-limit.login.window-seconds=${VMGEN_RATE_LIMIT_LOGIN_WINDOW:300}

# Proxmox API Configuration
# REQUIRED: Set PROXMOX_TOKEN_SECRET environment variable in production
proxmox.api.url=${PROXMOX_API_URL:https://172.22.21.95:8006/api2/json}
proxmox.api.token-id=${PROXMOX_TOKEN_ID:worker@pve!automation}
proxmox.api.token-secret=${PROXMOX_TOKEN_SECRET:CHANGE_ME_PROXMOX_TOKEN_SECRET}
proxmox.api.verify-ssl=${PROXMOX_VERIFY_SSL:false}
proxmox.api.node=${PROXMOX_NODE:pve}
