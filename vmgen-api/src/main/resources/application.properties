spring.application.name=vmgen-api

# Local dev convenience:
# Load variables from a local ".env" file in the working directory (NOT committed).
# Format must be properties-style: KEY=value (e.g., PROXMOX_TOKEN_SECRET=...).
spring.config.import=optional:file:.env[.properties]

# Datasource — runtime connection. Defaults to the owner (DB_USERNAME) so local
# dev is unchanged; set DB_API_USERNAME/DB_API_PASSWORD to run as a restricted,
# DML-only user in production. Migrations still run as the owner (see Flyway).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vmgen}
spring.datasource.username=${DB_API_USERNAME:${DB_USERNAME:vmgen}}
spring.datasource.password=${DB_API_PASSWORD:${DB_PASSWORD:vmgen}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:50}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.keepalive-time=30000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — migrations always run as the schema owner (DB_USERNAME), which holds
# DDL rights, even when the runtime datasource above uses a restricted user.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_USERNAME:vmgen}
spring.flyway.password=${DB_PASSWORD:vmgen}

# JWT (HS256)
# REQUIRED: Set VMGEN_JWT_SECRET environment variable in production
# Minimum 32 bytes (256 bits) for HS256
vmgen.jwt.secret=${VMGEN_JWT_SECRET:CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME}
vmgen.jwt.issuer=vmgen-api
vmgen.jwt.user-ttl-seconds=3600
vmgen.jwt.admin-ttl-seconds=1800

# CORS Configuration
# Comma-separated list of allowed origins (e.g., http://localhost:5173,https://vmgen.example.com)
vmgen.cors.allowed-origins=${VMGEN_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
vmgen.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
vmgen.cors.allowed-headers=Authorization,Content-Type
vmgen.cors.allow-credentials=true
vmgen.cors.max-age=3600

# Rate Limiting
# Login attempts per IP per time window.
# SECURITY: IP extraction trusts X-Forwarded-For only when the API sits behind
# a trusted reverse proxy (Nginx/Traefik). Ensure the proxy strips or rewrites the
# header to prevent clients from spoofing their IP and bypassing the rate limiter.
vmgen.rate-limit.login.max-requests=${VMGEN_RATE_LIMIT_LOGIN_MAX:5}
vmgen.rate-limit.login.window-seconds=${VMGEN_RATE_LIMIT_LOGIN_WINDOW:300}

# Proxmox API Configuration
# REQUIRED: Set PROXMOX_TOKEN_SECRET environment variable in production
proxmox.api.url=${PROXMOX_API_URL:https://172.22.21.95:8006/api2/json}
proxmox.api.token-id=${PROXMOX_TOKEN_ID:worker@pve!automation}
proxmox.api.token-secret=${PROXMOX_TOKEN_SECRET:CHANGE_ME_PROXMOX_TOKEN_SECRET}
proxmox.api.verify-ssl=${PROXMOX_VERIFY_SSL:false}
proxmox.api.node=${PROXMOX_NODE:pve}

#Worker API Key
worker.api.key=${WORKER_API_KEY:CHANGE_ME_WORKER_API_KEY}

# Platform Secret — HMAC-SHA256 key for flag and VM-password derivation.
# Backend only: workers request derived values via /api/worker/jobs/{id}/derive-flags
# and never hold this secret.
# Minimum 32 characters.
vmgen.platform.secret=${PLATFORM_SECRET:CHANGE_ME_PLATFORM_SECRET_MIN_32_CHARS}

# Telemetry retention — uploaded telemetry data is automatically soft-deleted after this many days.
# Users can also delete their telemetry at any time via the UI.
vmgen.telemetry.retention-days=${TELEMETRY_RETENTION_DAYS:90}

# OVA retention period — builds in READY state older than this are transitioned to ARCHIVED
# and their storage_path is cleared (OVA no longer downloadable). Metadata and provenance are kept.
vmgen.ova.retention-days=${OVA_RETENTION_DAYS:7}

# OVA storage directory — used for service health metrics (disk capacity).
# Must match EXPORT_PATH on the worker.
vmgen.ova.storage-dir=${OVA_STORAGE_DIR:/var/lib/vmgen/exports}

# Actuator — only the health endpoint is exposed; show-details=never hides internals from unauthenticated clients
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI / Swagger UI
# Default is OFF. Set SWAGGER_ENABLED=true to enable in development environments.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
