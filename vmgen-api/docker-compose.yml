version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: vmgen-postgres
    environment:
      POSTGRES_DB: vmgen
      POSTGRES_USER: vmgen
      POSTGRES_PASSWORD: vmgen
    ports:
      - "5432:5432"
    volumes:
      - vmgen_pgdata:/var/lib/postgresql/data
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vmgen-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: "no"

volumes:
  vmgen_pgdata:
