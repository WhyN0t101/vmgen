server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OVA downloads — stream large files straight through. With the default
    # proxy_buffering, nginx spools the entire (multi-GB) OVA before sending the
    # first byte to the client, so the download appears to "hang" for minutes and
    # then complete quickly. Disabling buffering passes bytes through as they
    # arrive, so the download starts immediately. Generous read timeout for big
    # files. (Regex location is matched before the /api/ prefix below.)
    location ~ ^/api/builds/[^/]+/download$ {
        proxy_pass http://vmgen-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://vmgen-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Actuator health (used by Docker healthcheck)
    location /actuator/ {
        proxy_pass http://vmgen-api:8080/actuator/;
        proxy_set_header Host $host;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
