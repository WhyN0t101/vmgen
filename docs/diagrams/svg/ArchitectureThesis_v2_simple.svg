<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="Helvetica, Arial, sans-serif">
  <title>VMGen Four-Layer Reference Architecture (Simplified)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="600" fill="#ffffff"/>

  <text x="520" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Four-Layer Reference Architecture</text>

  <!-- Trust boundary -->
  <rect x="25" y="125" width="990" height="380" rx="16" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="1005" y="120" text-anchor="end" font-size="12" font-style="italic" fill="#475569">Trusted Computing Base</text>

  <!-- Frontend -->
  <rect x="40" y="45" width="920" height="60" rx="12" fill="#eef1f4" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Web Frontend</text>

  <!-- Backend -->
  <rect x="40" y="140" width="920" height="60" rx="10" fill="#cfe2f3" stroke="#1f6091" stroke-width="2"/>
  <text x="500" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Backend API - Control Plane</text>

  <!-- Worker -->
  <rect x="40" y="235" width="920" height="60" rx="10" fill="#a9cce3" stroke="#1f6091" stroke-width="2"/>
  <text x="500" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Automation Worker</text>

  <!-- Infrastructure -->
  <rect x="40" y="330" width="920" height="140" rx="10" fill="#5f9bc7" stroke="#1f6091" stroke-width="2"/>
  <text x="500" y="353" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Infrastructure Layer</text>

  <rect x="60" y="370" width="260" height="80" rx="8" fill="#eef4fa" stroke="#1f6091" stroke-width="1.5"/>
  <text x="190" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Proxmox</text>

  <rect x="370" y="370" width="260" height="80" rx="8" fill="#eef4fa" stroke="#1f6091" stroke-width="1.5"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Storage Repository</text>

  <rect x="680" y="370" width="260" height="80" rx="8" fill="#eef4fa" stroke="#1f6091" stroke-width="1.5"/>
  <text x="810" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Database</text>

  <!-- Arrows: Frontend <-> Backend -->
  <line x1="150" y1="105" x2="150" y2="140" stroke="#334155" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="160" y="120" font-size="10.5" fill="#334155">Submit request / build status</text>

  <!-- Arrows: Backend <-> Worker -->
  <line x1="150" y1="200" x2="150" y2="235" stroke="#334155" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="160" y="221" font-size="10.5" fill="#334155">Job spec / progress &amp; complete</text>

  <!-- Arrows: Worker -> Infrastructure -->
  <line x1="190" y1="295" x2="190" y2="330" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="200" y="316" font-size="10" fill="#334155">Clone + inject (SSH)</text>

  <line x1="500" y1="295" x2="500" y2="330" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="510" y="316" font-size="10" fill="#334155">Export OVA</text>

  <!-- Arrow: Backend <-> Database, routed around Worker -->
  <path d="M960,170 H985 V410 H940" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1000" y="290" text-anchor="middle" font-size="10" fill="#334155" transform="rotate(-90 1000 290)">Exclusive DB read/write</text>

  <!-- Legend -->
  <line x1="60" y1="525" x2="100" y2="525" stroke="#64748b" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="110" y="529" font-size="11" fill="#334155">Trust boundary</text>

  <line x1="60" y1="545" x2="100" y2="545" stroke="#334155" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="110" y="549" font-size="11" fill="#334155">Synchronous REST call / data flow</text>
</svg>
