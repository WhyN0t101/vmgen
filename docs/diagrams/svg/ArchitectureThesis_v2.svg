<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="840" viewBox="0 0 1040 840" font-family="Helvetica, Arial, sans-serif">
  <title>VMGen Four-Layer Reference Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="840" fill="#ffffff"/>

  <text x="520" y="26" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Four-Layer Reference Architecture</text>

  <!-- Trust boundary -->
  <rect x="25" y="185" width="990" height="580" rx="16" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="1005" y="203" text-anchor="end" font-size="16" font-style="italic" fill="#475569">Trusted Computing Base</text>

  <!-- Frontend -->
  <rect x="40" y="45" width="920" height="130" rx="12" fill="#eef1f4" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="70" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Web Frontend</text>
  <text x="500" y="88" text-anchor="middle" font-size="14.5" font-style="italic" fill="#64748b">(untrusted - outside build-time trust boundary)</text>
  <text x="190" y="112" text-anchor="middle" font-size="16" fill="#1e293b">Admin Management</text>
  <text x="500" y="112" text-anchor="middle" font-size="16" fill="#1e293b">Scenario Configuration</text>
  <text x="810" y="112" text-anchor="middle" font-size="16" fill="#1e293b">VM Generation Request</text>
  <text x="190" y="134" text-anchor="middle" font-size="16" fill="#1e293b">Download Artefact</text>
  <text x="500" y="134" text-anchor="middle" font-size="16" fill="#1e293b">Build Monitoring</text>
  <text x="810" y="134" text-anchor="middle" font-size="16" fill="#1e293b">Flag Submission</text>

  <!-- Backend -->
  <rect x="40" y="225" width="920" height="150" rx="10" fill="#cfe2f3" stroke="#1f6091" stroke-width="2"/>
  <text x="500" y="250" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Backend API - Control Plane</text>
  <text x="190" y="278" text-anchor="middle" font-size="16" fill="#1e293b">Session Auth (JWT + Argon2id)</text>
  <text x="500" y="278" text-anchor="middle" font-size="16" fill="#1e293b">Template &amp; Script Repository</text>
  <text x="810" y="278" text-anchor="middle" font-size="16" fill="#1e293b">Provenance Registration</text>
  <text x="190" y="300" text-anchor="middle" font-size="16" fill="#1e293b">RBAC / Access Control</text>
  <text x="500" y="300" text-anchor="middle" font-size="16" fill="#1e293b">Flag Derivation (HMAC-SHA256)</text>
  <text x="810" y="300" text-anchor="middle" font-size="16" fill="#1e293b">Build State Machine</text>
  <text x="500" y="340" text-anchor="middle" font-size="14.5" fill="#334155">queued > building > exporting > ready > archived&#160;&#160;(+ failed on timeout)</text>

  <!-- Worker -->
  <rect x="40" y="430" width="920" height="150" rx="10" fill="#a9cce3" stroke="#1f6091" stroke-width="2"/>
  <text x="500" y="455" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Automation Worker</text>
  <text x="190" y="483" text-anchor="middle" font-size="16" fill="#1e293b">Claim Job (poll)</text>
  <text x="500" y="483" text-anchor="middle" font-size="16" fill="#1e293b">Vulnerability Injection (SSH)</text>
  <text x="810" y="483" text-anchor="middle" font-size="16" fill="#1e293b">OVA Export</text>
  <text x="190" y="505" text-anchor="middle" font-size="16" fill="#1e293b">Template Cloning</text>
  <text x="500" y="505" text-anchor="middle" font-size="16" fill="#1e293b">Flag Placement</text>
  <text x="810" y="505" text-anchor="middle" font-size="16" fill="#1e293b">Provenance Assembly</text>
  <text x="500" y="545" text-anchor="middle" font-size="14.5" font-style="italic" fill="#475569">Holds no database credentials - all persistence mediated via Backend API</text>

  <!-- Infrastructure -->
  <rect x="40" y="635" width="920" height="150" rx="10" fill="#5f9bc7" stroke="#1f6091" stroke-width="2"/>
  <text x="500" y="660" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Infrastructure Layer</text>

  <rect x="60" y="680" width="260" height="80" rx="8" fill="#eef4fa" stroke="#1f6091" stroke-width="1.5"/>
  <text x="190" y="712" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Proxmox</text>
  <text x="190" y="730" text-anchor="middle" font-size="16" fill="#1e293b">Virtualisation Host</text>

  <rect x="370" y="680" width="260" height="80" rx="8" fill="#eef4fa" stroke="#1f6091" stroke-width="1.5"/>
  <text x="500" y="712" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Storage Repository</text>
  <text x="500" y="730" text-anchor="middle" font-size="16" fill="#1e293b">(Templates &amp; Artefacts)</text>

  <rect x="680" y="680" width="260" height="80" rx="8" fill="#eef4fa" stroke="#1f6091" stroke-width="1.5"/>
  <text x="810" y="712" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Database</text>
  <text x="810" y="730" text-anchor="middle" font-size="16" fill="#1e293b">(PostgreSQL 16)</text>

  <!-- Arrows: Frontend <-> Backend -->
  <path d="M150,175 L150,225" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="160" y="196" font-size="14" fill="#334155">Submit request</text>
  <text x="160" y="210" font-size="14" fill="#334155">(REST, authenticated)</text>

  <path d="M850,225 L850,175" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="840" y="196" text-anchor="end" font-size="14" fill="#334155">Build status,</text>
  <text x="840" y="210" text-anchor="end" font-size="14" fill="#334155">validation result</text>

  <!-- Arrows: Backend <-> Worker -->
  <path d="M150,375 L150,430" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="160" y="396" font-size="14" fill="#334155">Job spec + flags</text>
  <text x="160" y="410" font-size="14" fill="#334155">(response)</text>

  <path d="M850,430 L850,375" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="840" y="396" text-anchor="end" font-size="14" fill="#334155">Claim / progress / complete</text>
  <text x="840" y="410" text-anchor="end" font-size="14" fill="#334155">(worker-initiated REST)</text>

  <!-- Arrows: Worker -> Infrastructure -->
  <path d="M190,580 L190,635" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="200" y="601" font-size="13.5" fill="#334155">Clone + inject</text>
  <text x="200" y="614" font-size="13.5" fill="#334155">(SSH)</text>

  <path d="M500,580 L500,635" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="550" y="601" text-anchor="middle" font-size="13.5" fill="#334155">Export OVA</text>
  <text x="551" y="614" text-anchor="middle" font-size="13.5" fill="#334155">(SFTP / shared mount)</text>

  <!-- Arrow: Backend <-> Database (exclusive), routed around Worker -->
  <path d="M960,300 H985 V608 H810 V635" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1000" y="470" text-anchor="middle" font-size="13.5" fill="#334155" transform="rotate(-90 1000 470)">Exclusive DB read/write (templates, scripts, provenance, flag hashes, users)</text>

  <!-- Legend -->
  <line x1="60" y1="805" x2="100" y2="805" stroke="#64748b" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="110" y="809" font-size="14.5" fill="#334155">Trust boundary</text>

  <line x1="60" y1="822" x2="100" y2="822" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="110" y="826" font-size="14.5" fill="#334155">Synchronous REST call / data flow</text>
</svg>
